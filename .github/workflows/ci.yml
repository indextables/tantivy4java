name: CI

# Every event (pull request, push to main, workflow_dispatch) runs the same
# two GitHub-hosted legs:
#
#   linux   ubuntu-24.04, x86_64
#   macos   macos-15, arm64
#
# Each leg runs ./scripts/setup.sh, make compile, make test and the Rust unit
# tests. `ci-ok` passes only when both legs have succeeded.
#
# One result is advisory for now: the Rust tests on Linux report a failure but
# do not fail their leg (see "Rust tests: run" in the linux job). Everything
# else, including the Linux build and the Linux Java tests, is blocking.
#
# Standard runner labels only (ubuntu-24.04, macos-15). Larger runners are
# billed; do not use them here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request cancels the run for the older one. Every
# other run (push to main, workflow_dispatch) gets a group of its own, so it
# is never cancelled and never queued behind another run: a group shared by
# all pushes to main would keep only the newest waiting run and drop the rest.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # GitHub-hosted Linux x86_64.
  #
  # Measured cold on ubuntu-24.04 (4 cores, 16 GB) with 4 cargo jobs: about 25
  # minutes in total. Release build 11.5 minutes (peak memory 9.7 GB), Java
  # tests 7 minutes, dev-profile build of the Rust tests 6 minutes.
  # ---------------------------------------------------------------------------
  linux:
    name: Build & Test (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    outputs:
      # success, failure or skipped. Read by ci-ok to repeat the advisory
      # warning on the check that gates merging.
      rust_tests: ${{ steps.rust-tests.outcome }}
    env:
      # One cargo job per core, which is cargo's default and what was measured
      # on this runner size. Set explicitly so that a change in the runner's
      # core count cannot silently change the memory needed.
      CARGO_BUILD_JOBS: '4'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Java 11 is what scripts/setup.sh requires.
      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup dependencies
        run: ./scripts/setup.sh

      # The pom builds the native library with
      # `cargo build --release --target-dir ${rust.target.dir}`, by default
      # target/rust. `make compile` is `mvn clean compile`, and `clean` deletes
      # target/ and with it anything restored there. Pointing the property at
      # native/target, cargo's own default directory for the crate and the one
      # `cargo test` uses, keeps the cargo output out of the way of `clean` and
      # puts the release and the test build in one directory. MAVEN_ARGS is
      # honored by Maven >= 3.9 for every mvn invocation made by make.
      - name: Use native/target as the cargo target directory
        run: echo "MAVEN_ARGS=-Drust.target.dir=$GITHUB_WORKSPACE/native/target" >> "$GITHUB_ENV"

      # Everything outside the repository that decides what cargo produces:
      # the Rust toolchain, the C compiler used by build scripts, protoc (it
      # generates code for the quickwit crates) and the RUSTFLAGS that the pom
      # passes to cargo. Runs after setup.sh, which installs protoc.
      - name: Describe the native toolchain
        id: toolchain
        run: |
          {
            rustc -vV
            cargo -V
            cc --version | sed -n 1p
            protoc --version
            grep -o '<RUSTFLAGS>[^<]*</RUSTFLAGS>' pom.xml | sort -u || true
          } | tee "$RUNNER_TEMP/native-toolchain.txt"
          if command -v sha256sum > /dev/null 2>&1; then
            sum="$(sha256sum < "$RUNNER_TEMP/native-toolchain.txt")"
          else
            sum="$(shasum -a 256 < "$RUNNER_TEMP/native-toolchain.txt")"
          fi
          fingerprint="${sum:0:16}"
          if [[ ! "$fingerprint" =~ ^[0-9a-f]{16}$ ]]; then
            echo "::error::Could not compute the native toolchain fingerprint (got '$fingerprint')"
            exit 1
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      # Third-party crates only: downloaded sources (~/.cargo/registry and
      # ~/.cargo/git) and what cargo compiled from them, for both the release
      # build and the dev-profile build of the Rust tests. That is most of the
      # cargo time of a cold run. This repository's own crate is never in the
      # entry (see "Remove this crate's own outputs" below) and is compiled
      # from the checked-out sources in every run.
      #
      # The key names what those outputs are made from: runner OS and
      # architecture, the toolchain fingerprint above, and the files that pin
      # every dependency and its build settings (Cargo.lock, Cargo.toml and
      # .cargo/config.toml). Exact match only, no restore-keys: outputs built
      # for other dependency versions or by another toolchain are not restored.
      # On a miss the job builds everything, as a cold run does.
      #
      # Sources and outputs are in one entry so that they are restored with
      # the modification times they had when the outputs were built; cargo
      # compares those times to decide whether a build script has to run again.
      #
      # Size: about 9 GB on disk and an estimated 3 GB compressed per runner
      # type, so about 6 GB for the two entries against the repository's 10 GB
      # cache limit. When a key changes, the entry it replaces stays until
      # GitHub evicts it (unused for 7 days, or least recently used first once
      # the limit is exceeded).
      #
      # These entries are for this workflow only. A build whose output is
      # published must not restore them.
      #
      # Restore only: see "Save cargo dependencies" at the end of the job.
      - name: Restore cargo dependencies and their build outputs
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ci-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml', '.cargo/config.toml') }}

      - name: Build
        run: make compile

      - name: Test
        run: make test

      # The Rust tests are built and run in two steps so that a build failure
      # and a test failure are told apart, here and in the save condition at
      # the end of the job.
      - name: "Rust tests: build"
        id: rust-build
        run: cd native && cargo test --lib --tests --no-run

      # ADVISORY on Linux: a failure here is reported but does not fail the
      # job. One test, parquet_companion::indexing::tests::
      # test_multi_segment_docid_mapping_correctness, fails on this runner.
      # To make this step blocking again, delete the `continue-on-error: true`
      # line below. Nothing else needs to change: the step after this one
      # then no longer runs, and ci-ok fails with the job.
      - name: "Rust tests: run"
        id: rust-tests
        continue-on-error: true
        run: cd native && cargo test --lib --tests

      # Makes the advisory failure visible: a warning annotation on the run
      # and a paragraph in the job summary. ci-ok repeats the warning.
      - name: Report advisory Rust test failure
        if: steps.rust-tests.outcome == 'failure'
        run: |
          echo "::warning title=Advisory check failed - Rust tests on Linux x86_64::cargo test failed on Linux x86_64. The result is advisory, so the job was not failed. See the step 'Rust tests: run' of this job for the failing tests."
          {
            echo "### Advisory check failed: Rust tests on Linux x86_64"
            echo ""
            echo "\`cargo test --lib --tests\` failed on this leg. The result is advisory for now, so the job and \`ci-ok\` were not failed by it. The failing tests are listed at the end of the \"Rust tests: run\" step log."
          } >> "$GITHUB_STEP_SUMMARY"

      # Everything cargo built from this repository's own crate is removed
      # before the entry is saved: the library, the test binary, their
      # fingerprints and dependency files, the build-script output and the
      # incremental state. What is left was built from third-party sources
      # only, which the key pins.
      #
      # Runs only on main, only when the restore above missed, and only when
      # both cargo builds completed, so that an entry is always complete. A
      # Rust test failure does not prevent saving; the outputs are the same
      # either way. If anything of this crate is still there afterwards, the
      # step warns and the save step below is skipped.
      - name: Remove this crate's own outputs before saving
        id: prune
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' && steps.rust-build.outcome == 'success' }}
        run: |
          for dir in native/target/release native/target/debug; do
            if [[ ! -d "$dir" ]]; then
              echo "::warning::$dir does not exist, so the cargo target directory is not where this workflow expects it. Nothing is saved."
              exit 0
            fi
          done
          rm -rf native/target/release/incremental native/target/debug/incremental
          # Every file and directory cargo names after this crate, wherever it is.
          find native/target -name '*tantivy4java*' -prune -exec rm -rf {} +
          leftover="$(find native/target -name '*tantivy4java*' | sed -n '1,20p')"
          if [[ -n "$leftover" ]]; then
            echo "::warning::Outputs of this repository's own crate are still in native/target after the clean-up. Nothing is saved."
            echo "$leftover"
            exit 0
          fi
          du -sh native/target/release native/target/debug ~/.cargo/registry ~/.cargo/git || true
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Only runs on main save this entry (the step above runs only there). An
      # entry saved on the default branch can be restored by every pull
      # request; one saved by a pull request could be restored by that pull
      # request alone and would only use up the repository's cache quota. It
      # also means that every shared entry was built by a run of the code
      # that is on main.
      - name: Save cargo dependencies and their build outputs
        if: ${{ !cancelled() && steps.prune.outputs.ok == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-surefire-reports
          path: |
            target/surefire-reports/
            hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # GitHub-hosted macOS arm64.
  #
  # Measured cold on macos-15 (3 cores, 7 GB): about 38 minutes in total.
  # Release build 18.5 minutes with 3 cargo jobs (peak memory 5.4 GB, no
  # swap), Java tests 8.5 minutes, dev-profile build of the Rust tests 11
  # minutes with 2 cargo jobs (peak memory 4.4 GB). All Rust tests pass here
  # and are blocking.
  #
  # The job name is the status check that branch protection on main requires.
  # Keep it exactly as it is until the required check has been changed to
  # `ci-ok`.
  # ---------------------------------------------------------------------------
  macos:
    name: Build & Test (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # cargo jobs for the release build: one per core, as measured on this
      # runner size. The Rust test steps below use 2.
      CARGO_BUILD_JOBS: '3'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup dependencies
        run: ./scripts/setup.sh

      # See the linux job for why the native library is built in native/target.
      - name: Use native/target as the cargo target directory
        run: echo "MAVEN_ARGS=-Drust.target.dir=$GITHUB_WORKSPACE/native/target" >> "$GITHUB_ENV"

      # See the linux job for what goes into the fingerprint.
      - name: Describe the native toolchain
        id: toolchain
        run: |
          {
            rustc -vV
            cargo -V
            cc --version | sed -n 1p
            protoc --version
            grep -o '<RUSTFLAGS>[^<]*</RUSTFLAGS>' pom.xml | sort -u || true
          } | tee "$RUNNER_TEMP/native-toolchain.txt"
          if command -v sha256sum > /dev/null 2>&1; then
            sum="$(sha256sum < "$RUNNER_TEMP/native-toolchain.txt")"
          else
            sum="$(shasum -a 256 < "$RUNNER_TEMP/native-toolchain.txt")"
          fi
          fingerprint="${sum:0:16}"
          if [[ ! "$fingerprint" =~ ^[0-9a-f]{16}$ ]]; then
            echo "::error::Could not compute the native toolchain fingerprint (got '$fingerprint')"
            exit 1
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      # See the linux job for how this entry is keyed, restored and saved.
      - name: Restore cargo dependencies and their build outputs
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ci-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml', '.cargo/config.toml') }}

      - name: Build
        run: make compile

      - name: Test
        run: make test

      # 2 cargo jobs for the dev-profile build of the Rust tests: that is what
      # was measured on this 7 GB runner; 3 has not been tried.
      - name: "Rust tests: build"
        id: rust-build
        env:
          CARGO_BUILD_JOBS: '2'
        run: cd native && cargo test --lib --tests --no-run

      - name: "Rust tests: run"
        id: rust-tests
        env:
          CARGO_BUILD_JOBS: '2'
        run: cd native && cargo test --lib --tests

      # See the linux job for what is removed and when the entry is saved.
      - name: Remove this crate's own outputs before saving
        id: prune
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' && steps.rust-build.outcome == 'success' }}
        run: |
          for dir in native/target/release native/target/debug; do
            if [[ ! -d "$dir" ]]; then
              echo "::warning::$dir does not exist, so the cargo target directory is not where this workflow expects it. Nothing is saved."
              exit 0
            fi
          done
          rm -rf native/target/release/incremental native/target/debug/incremental
          # Every file and directory cargo names after this crate, wherever it is.
          find native/target -name '*tantivy4java*' -prune -exec rm -rf {} +
          leftover="$(find native/target -name '*tantivy4java*' | sed -n '1,20p')"
          if [[ -n "$leftover" ]]; then
            echo "::warning::Outputs of this repository's own crate are still in native/target after the clean-up. Nothing is saved."
            echo "$leftover"
            exit 0
          fi
          du -sh native/target/release native/target/debug ~/.cargo/registry ~/.cargo/git || true
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Save cargo dependencies and their build outputs
        if: ${{ !cancelled() && steps.prune.outputs.ok == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-surefire-reports
          path: |
            target/surefire-reports/
            hs_err_pid*.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The single check to require for merging.
  #
  # `if: always()` is essential. Without it this job would be skipped whenever
  # a leg fails or the run is cancelled, and a skipped required check counts
  # as passing. With it the job always runs and decides from the results.
  #
  # Every job in `needs` must have the result `success`; failure, cancelled
  # and skipped all fail this check. The step reads the results of whatever
  # `needs` lists, so to put another job under this check, add it to `needs`
  # and nothing else.
  #
  # The advisory Rust test result on Linux does not change the result of the
  # linux job, so it does not change this check either. When it is red, this
  # job repeats the warning so that it is seen on the check that gates merging.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: ci-ok
    if: always()
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Require every hosted leg to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if jq -e '.linux.result == "success" and .linux.outputs.rust_tests == "failure"' <<< "$NEEDS" > /dev/null; then
            echo "::warning title=Advisory check failed - Rust tests on Linux x86_64::The Rust tests failed on the Linux leg. The result is advisory and did not fail this check. See the step 'Rust tests: run' of the Linux job."
            echo "**Advisory check failed:** the Rust tests failed on the Linux leg. The result is advisory and did not fail \`ci-ok\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          if jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null; then
            echo "Every hosted leg succeeded."
          else
            echo "::error::Not every hosted leg succeeded (results above). Failed, cancelled and skipped legs all count as not passed."
            exit 1
          fi
