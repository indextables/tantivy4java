version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      test-dependencies:
        dependency-type: development

  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      tantivy-ecosystem:
        patterns:
          - "tantivy*"
          - "quickwit*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
